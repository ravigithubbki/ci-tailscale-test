name: Windows Tailscale Access

on:
  workflow_dispatch:

jobs:
  ts-windows:
    runs-on: windows-latest
    timeout-minutes: 360        # GitHub-hosted runner ki hard cap (6h)

    steps:
      - name: Install Tailscale
        shell: powershell
        run: |
          winget install --id Tailscale.Tailscale -e `
            --accept-source-agreements --accept-package-agreements --silent
          Start-Sleep -Seconds 15

      - name: Verify Tailscale service is running
        shell: powershell
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" version
          Get-Service Tailscale

      - name: tailscale up (authkey, no manual login needed)
        shell: powershell
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TS_AUTHKEY }} `
            --hostname=gh-ci-windows `
            --accept-risk=lose-ssh

      - name: Confirm connection + show IP
        shell: powershell
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" status
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: Enable Windows OpenSSH Server (Tailscale doesn't support --ssh on Windows)
        shell: powershell
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          Start-Service sshd
          Set-Service -Name sshd -StartupType 'Automatic'
          if (!(Get-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -DisplayName "OpenSSH Server (sshd)" `
              -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22
          }

      - name: Enable Remote Desktop (RDP)
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService
          # NLA disable kar rahe hain kyunki Tailscale IP se connect karte waqt
          # domain/network trust prompt aa sakta hai; isse skip ho jaata hai
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0

      - name: Set a temporary password for SSH/RDP login
        shell: powershell
        run: |
          net user runneradmin "${{ secrets.WIN_SSH_PASSWORD }}"
          echo "=================================================="
          echo " SSH:  ssh runneradmin@gh-ci-windows"
          echo " RDP:  connect to gh-ci-windows (or its tailscale IP) on port 3389"
          echo "       username: runneradmin"
          echo "       password = value of your WIN_SSH_PASSWORD secret"
          echo "=================================================="

      - name: Keep alive for remote testing
        shell: powershell
        run: |
          Start-Sleep -Seconds 20700   # ~345 min, 360 min job cap me se buffer nikal ke
